
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Khoa | Personal Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg,
        #101827, #1d3557);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    main { padding: 30px; }

    h1 {
      font-size: clamp(36px, 7vw, 64px);
      margin-bottom: 10px;
    }

    p { color: #cbd5e1; }

    a {
      display: inline-block;
      margin-top: 25px;
      padding: 13px 25px;
      border: 1px solid white;
      border-radius: 8px;
      color: white;
      text-decoration: none;
    }

    a:hover {
      background: white;
      color: #101827;
    }
  </style>
</head>

<body>
  <main>
    <h1>Hello, I'm Khoa.</h1>
    <p>Welcome to my personal website.</p>
    <p>Explore my journey, projects and achievements.</p>
    <a href="../">Back to homepage</a>
  </main>
</body>
</html>
